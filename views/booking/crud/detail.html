{{ define "title" }}Detail Booking{{ end }}
{{ define "content" }}
  <div class="container mt-3">
    <div class="row mb-3">
      <div class="col">
        <h1>Detail Booking</h1>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div class="mb-3 row">
            <label for="user_name" class="col-sm-4 col-form-label">User Name</label>
            <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext" id="user_name" value="Saitama">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="user_phone" class="col-sm-4 col-form-label">User Phone</label>
            <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext" id="user_phone" value="625372832832">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="check_in_date" class="col-sm-4 col-form-label">Check in Date</label>
            <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext" id="check_in_date" value="Tuesday, 2 October 2023">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="check_out_date" class="col-sm-4 col-form-label">Check out Date</label>
            <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext" id="check_out_date" value="Tuesday, 10 October 2023">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="room_number" class="col-sm-4 col-form-label">Room Number</label>
            <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext" id="room_number" value="RN32">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="room_picture" class="col-sm-4 col-form-label">Room Picture</label>
            <div class="col-sm-8">
            <img src="..." class="img-thumbnail" alt="...">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="total_price" class="col-sm-4 col-form-label">Total Price</label>
            <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext" id="total_price" value="Rp. 89.000">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="price_per_day" class="col-sm-4 col-form-label">Transaction Proof</label>
            <div class="col-sm-8">
            <img src="..." class="img-thumbnail" alt="...">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="created_at" class="col-sm-4 col-form-label">Created At</label>
            <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext" id="created_at" value="Tuesday, 1 October 2023">
            </div>
        </div>
      </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <div class="d-grip gap-2 d-md-flex justify-content-md-end">
                <a href="/bookings" class="btn btn-secondary me-md-2">
                    <img src="/assets/icons/arrow-left.svg" alt="Back">
                    Back
                </a>
                <a href="/edit_booking?id={{ .Room.ID }}" class="btn btn-primary">
                    <img src="/assets/icons/pencil-square.svg" alt="Edit">
                    Edit Room
                </a>
            </div>
        </div>
    </div>
  </div>
{{ end }}
