{{ define "title" }}Add Room{{ end }}
{{ define "content" }}
  <div class="container mt-3">
    <div class="row mb-3">
      <div class="col">
        <h1>Tambah Ruangan</h1>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <form>
            <div class="mb-3">
                <label for="name" class="form-label">Room Name</label>
                <input type="text" class="form-control" id="name">
            </div>
            <div class="mb-3">
                <label for="type" class="form-label">Type</label>
                <input type="text" class="form-control" id="type">
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label for="capacity" class="form-label">Capacity</label>
                <input type="number" class="form-control" id="capacity">
            </div>
            <div class="mb-3">
                <label for="status" class="form-label">Status</label>
                <select class="form-select" aria-label="status" id="status">
                    <option selected>Select The Status</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="image" class="form-label">Room Image</label>
                <input class="form-control" type="file" id="image">
            </div>
            <div class="mb-3">
                <label for="price_per_day" class="form-label">Price Per Day</label>
                <input type="number" class="form-control" id="price_per_day">
            </div>
            <button type="submit" class="btn btn-primary float-end">Submit</button>
        </form>
        <a href="/rooms" class="btn btn-secondary float-start">Back</a>
      </div>
    </div>
  </div>
{{ end }}
