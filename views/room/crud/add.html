{{ define "title" }}Add Room{{ end }}
{{ define "content" }}
  <div class="container mt-3">
    <div class="row mb-3">
      <div class="col">
        <h1>Tambah Ruangan</h1>
      </div>
    </div>
    
    <!-- Error Message -->
    {{ if .Error }}
    <div class="row mb-3">
      <div class="col">
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
          {{ .Error }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      </div>
    </div>
    {{ end }}
    
    <div class="row">
      <div class="col">
        <form action="/add_room" method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">
            <div class="mb-3">
                <label for="name" class="form-label">Room Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="name" id="name" 
                       value="{{ if .FormData.name }}{{ .FormData.name }}{{ end }}">
                <div class="form-text">Nama ruangan harus unik</div>
            </div>
            <div class="mb-3">
                <label for="type" class="form-label">Type <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="type" id="type" 
                       value="{{ if .FormData.type }}{{ .FormData.type }}{{ end }}">
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ if .FormData.description }}{{ .FormData.description }}{{ end }}</textarea>
            </div>
            <div class="mb-3">
                <label for="capacity" class="form-label">Capacity <span class="text-danger">*</span></label>
                <input type="number" class="form-control" name="capacity" id="capacity" min="1" 
                       value="{{ if .FormData.capacity }}{{ .FormData.capacity }}{{ end }}">
            </div>
            <div class="mb-3">
                <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
                <select class="form-select" aria-label="status" id="status" name="status">
                    <option value="">Select The Status</option>
                    <option value="active" {{ if eq .FormData.status "active" }}selected{{ end }}>Active</option>
                    <option value="inactive" {{ if eq .FormData.status "inactive" }}selected{{ end }}>Inactive</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="image" class="form-label">Room Image <span class="text-danger">*</span></label>
                <input class="form-control" type="file" id="image" name="image" accept="image/*">
                <div class="form-text">Format: JPG, PNG, GIF. Maksimal 2MB</div>
            </div>
            <div class="mb-3">
                <label for="price_per_day" class="form-label">Price Per Day <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="price_per_day" name="price_per_day" min="1" 
                       value="{{ if .FormData.price_per_day }}{{ .FormData.price_per_day }}{{ end }}">
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-primary float-end">Submit</button>
                <a href="/rooms" class="btn btn-secondary float-start">Back</a>
            </div>
        </form>
      </div>
    </div>
  </div>
{{ end }}
