{{ define "title" }}Detail Room{{ end }}
{{ define "content" }}
  <div class="container mt-3">
    <div class="row mb-3">
      <div class="col">
        <h1>Detail Ruangan</h1>
      </div>
    </div>
    <div class="row">
      <div class="col">
         <div class="mb-3 row">
            <label for="room_number" class="col-sm-4 col-form-label">Room Number</label>
            <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext" id="room_number" value="Room Number">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="type" class="col-sm-4 col-form-label">Type</label>
            <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext" id="type" value="Type">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="description" class="col-sm-4 col-form-label">Description</label>
            <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext" id="description" value="Description">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="capacity" class="col-sm-4 col-form-label">Capacity</label>
            <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext" id="capacity" value="Capacity">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="status" class="col-sm-4 col-form-label">Status</label>
            <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext" id="status" value="Status">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="price_per_day" class="col-sm-4 col-form-label">Image</label>
            <div class="col-sm-8">
            <img src="..." class="img-thumbnail" alt="...">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="price_per_day" class="col-sm-4 col-form-label">Price Per Day</label>
            <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext" id="price_per_day" value="Price Per Day">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="created_at" class="col-sm-4 col-form-label">Created At</label>
            <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext" id="created_at" value="Created At">
            </div>
        </div>
        <div class="d-grid gap-2">
            <a href="/rooms" class="btn btn-secondary">Back</a>
        </div>
      </div>
    </div>
  </div>
{{ end }}
